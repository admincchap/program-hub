.band{padding:clamp(20px,3vw,36px) max(5vw,16px)}

/* ---------- dates ---------- */
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],m[2]-1,+m[3]):null};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const days=s=>{const d=pd(s);return d?Math.round((d-today())/864e5):null};
function fmt(s,style){const d=pd(s);if(!d)return s||"";style=style||data.dateStyle;
  if(style==="short")return d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});
  if(style==="nodow")return d.toLocaleDateString("en-CA",{month:"long",day:"numeric",year:"numeric"});

const ICONS={excel:["Excel","X","#1d6f42"],word:["Word","W","#2b579a"],ppt:["PowerPoint","P","#c43e1c"],pdf:["PDF","PDF","#b3261e"],onenote:["OneNote","N","#7719aa"],forms:["Microsoft Forms","F","#038387"],teams:["Teams","T","#4b53bc"],folder:["Folder",FOLDER,"#b07d00"],

  brightspace:["Brightspace","B","#2e4a7d"],video:["Video",PLAY,"#cc0000"],web:["Website",GLOBE,"var(--acc)"]};
function guessIcon(u){u=(u||"").toLowerCase();
  if(/\/:x:\/|\.(xlsx|xlsm|xls|csv)(\?|$|#)/.test(u))return"excel";if(/\/:w:\/|\.(docx?|rtf)(\?|$|#)/.test(u))return"word";if(/\/:p:\/|\.(pptx?)(\?|$|#)/.test(u))return"ppt";
  if(/\/:b:\/|\.pdf(\?|$|#)/.test(u))return"pdf";if(/\/:f:\/|\/forms\/allitems|\/shared%20documents\/?($|\?)/.test(u))return"folder";if(/\/:o:\/|onenote/.test(u))return"onenote";if(/\/:v:\/|youtube\.com|youtu\.be|vimeo\.com|stream\.microsoft/.test(u))return"video";
  if(/forms\.office\.com|forms\.microsoft\.com/.test(u))return"forms";if(/teams\.microsoft\.com|teams\.live\.com/.test(u))return"teams";if(/canva\.com|canva\.link/.test(u))return"canva";
  if(/docs\.google\.com\/document/.test(u))return"gdoc";if(/docs\.google\.com\/spreadsheets/.test(u))return"gsheet";if(/docs\.google\.com\/presentation/.test(u))return"gslide";if(/docs\.google\.com\/forms|forms\.gle/.test(u))return"gform";if(/drive\.google\.com/.test(u))return"gdrive";
  if(/brightspace|d2l/.test(u))return"brightspace";return"web"}
function linkIcon(l){
  if(l.icon==="custom"){const c=/^#[\da-f]{6}$/i.test(l.iconColor||"")?l.iconColor:"#5e5e66";const t=(l.iconText||"?").slice(0,3);return`<span class="xl" aria-hidden="true" style="background:${c};color:${lum(c)>.4?"#16161a":"#fff"};font-size:${t.length>2?"11px":"14px"}">${esc(t)}</span>`}
  const k=ICONS[l.icon]?l.icon:guessIcon(l.url);const[ ,t,c]=ICONS[k];const isSvg=t.startsWith("<svg");
  return`<span class="xl" aria-hidden="true" style="background:${c};color:${c.startsWith("#")&&lum(c)>.4?"#16161a":c.startsWith("var")?"var(--on)":"#fff"};font-size:${!isSvg&&t.length>2?"10px":"14px"}">${isSvg?t:esc(t)}</span>`}

/* ---------- import / export ---------- */
function parseDate(s,order){s=(s||"").trim();if(!s)return"";let m;
  if(m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s))return mk(+m[1],+m[2],+m[3]);
  if(m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(s)){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    if(a>12)return mk(y,b,a);if(b>12)return mk(y,a,b);return order==="dmy"?mk(y,b,a):mk(y,a,b)}
  const d=new Date(s.replace(/(\d)(st|nd|rd|th)\b/,"$1"));return isNaN(d)?null:iso(d);
  function mk(y,mo,da){const d=new Date(y,mo-1,da);return d.getMonth()===mo-1?iso(d):null}}
function doImport(){
  const txt=$("imp").value.replace(/\r/g,"").trim();const msg=$("impmsg");
  if(!txt){msg.textContent="Paste your calendar first.";return}
  const rows=txt.split("\n").map(r=>r.split(r.includes("\t")?"\t":",").map(c=>c.trim().replace(/^"|"$/g,"")));
  const head=rows.shift();if(head.length<3){msg.textContent="I need at least three columns: Program, Intake and one date.";return}
  const order=$("dorder").value;let nP=0,nI=0,bad=0;
  rows.filter(r=>r.some(c=>c)).forEach(r=>{const pn=r[0],inn=r[1]||"Intake";if(!pn)return;
    let p=data.programs.find(x=>x.name.toLowerCase()===pn.toLowerCase());if(!p){p={id:uid(),name:pn,links:[],drafts:[],intakes:[],group:($("imptab")&&$("imptab").value)||"programs"};data.programs.push(p);nP++}
    let i=p.intakes.find(x=>x.name.toLowerCase()===inn.toLowerCase());if(!i){i={id:uid(),name:inn,target:"",enrolled:"",dates:[]};p.intakes.push(i);nI++}
    head.slice(2).forEach((h,k)=>{const v=r[k+2]||"",hl=h.trim();if(!hl)return;
      if(/^(code|short\s*code|program\s*code)$/i.test(hl)){if(v)p.code=v;return}
      if(/^target/i.test(hl)){if(v!=="")i.target=String(parseInt(v)||0);return}
      if(/^enrol/i.test(hl)){if(v!=="")i.enrolled=String(parseInt(v)||0);return}
      if(!v)return;const d=parseDate(v,order);if(!d){bad++;return}
      const ex=i.dates.find(x=>x.label.toLowerCase()===hl.toLowerCase());if(ex)ex.date=d;else i.dates.push({label:hl,date:d})})});
  normalize(data);save(true);cur=cur||data.programs[0]?.id;render();
  $("impmsg").textContent=`Done: ${nP} new program${nP===1?"":"s"}, ${nI} new intake${nI===1?"":"s"}${bad?`, ${bad} date${bad>1?"s":""} I couldn't read (left blank)`:""}.`;toast("Calendar imported");
}

async function readTally(file){await loadXL();const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());const rows=[];
  wb.worksheets.forEach(ws=>{const ym=/(20\d\d)/.exec(ws.name);if(!ym)return;const year=+ym[1];let mr=0,starts=[];
    for(let r=1;r<=8&&!mr;r++){const row=ws.getRow(r);const st=[];row.eachCell((c,col)=>{if(slave(c))return;const t=txt(c.value).toLowerCase();const k=MON.findIndex(m=>m.toLowerCase()===t);if(k>-1&&!st.some(x=>x.k===k))st.push({col,k})});if(st.length>=3){mr=r;starts=st}}
    if(!mr)return;const hr=ws.getRow(mr+1);
    const blocks=starts.map((s,j)=>{const end=j+1<starts.length?starts[j+1].col:s.col+5;const b={k:s.k};for(let c=s.col;c<end;c++){const t=txt(hr.getCell(c).value).toLowerCase();if(/intake/.test(t)&&!b.ic)b.ic=c;else if(/date/.test(t)&&!b.dc)b.dc=c;else if(/enrol/.test(t)&&!b.ec)b.ec=c}return b}).filter(b=>b.ec);

  let h=`<h2>${esc(nm("inventory"))}</h2><div class="subnav" role="group" aria-label="Inventory sections">${T.map(([k,l])=>`<button type="button" data-act="invtab" data-v="${k}" aria-pressed="${k===invTab}">${l}</button>`).join("")}</div>`;
  return h+({items:invItems,count:invCount,orders:invOrders,deliv:invDelivs,reports:invReports,setup:invSetup}[invTab]||invItems)(ed)}

function itemForm(it){const tags=allTags();const sp=I().suppliers;
  return`<form class="form" data-form="invitem" data-id="${it.id||""}"><div class="grid2"><div><label for="ii-n">Item name</label><input id="ii-n" name="name" required value="${esc(it.name||"")}" placeholder="e.g. Vacutainer tubes, lavender top"></div><div><label for="ii-b">Brand</label><input id="ii-b" name="brand" value="${esc(it.brand||"")}" placeholder="e.g. BD"></div></div>
<div class="grid3"><div><label for="ii-c">Item or catalogue #</label><input id="ii-c" name="code" value="${esc(it.code||"")}"></div><div><label for="ii-u">Unit you count and order in</label><input id="ii-u" name="unit" value="${esc(it.unit||"")}" placeholder="e.g. box of 100"></div><div><label for="ii-s">Supplier</label><select id="ii-s" name="supplier"><option value="">None</option>${sp.map(s=>`<option value="${s.id}"${s.id===it.supplier?" selected":""}>${esc(s.name)}</option>`).join("")}</select></div></div>
<label>Tags</label><div class="row">${tags.map(t=>`<label class="chk"><input type="checkbox" name="tag" value="${esc(t)}"${(it.tags||[]).includes(t)?" checked":""}> ${esc(t)}</label>`).join("")}<input name="newtags" placeholder="${tags.length?"Add another tag":"e.g. Phlebotomy, IM, General"}" style="width:auto;flex:1 1 200px"></div><p class="hint" style="margin:4px 0 0">Separate new tags with commas. An item can have several.</p>
<div class="grid3"><div><label for="ii-r">Reorder at (units)</label><input id="ii-r" name="reorder" type="number" step="any" min="0" value="${esc(it.reorder??"")}" placeholder="e.g. 3"></div><div><label for="ii-k">Keep on hand (optional)</label><input id="ii-k" name="keep" type="number" step="any" min="0" value="${esc(it.keep??"")}" placeholder="used for order suggestions"></div>${it.id?"":`<div><label for="ii-0">How many you have now</label><input id="ii-0" name="start" type="number" step="any" min="0" placeholder="e.g. 4.5"></div>`}</div>
${it.id?"":`<div class="grid3">${byInp()}</div>`}
<label>Photo</label><div class="row" style="align-items:center"><span id="ii-prev">${pendPhoto?`<img class="thumb" src="${pendPhoto.d}" alt="">`:phImg(it.photo,"thumb")}</span><label class="btn" for="ii-photo" style="margin:0;cursor:pointer">${it.photo||pendPhoto?"Change photo":"Add photo"}</label><input type="file" id="ii-photo" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0">${it.photo?`<label class="chk"><input type="checkbox" name="nophoto"> Remove photo</label>`:""}</div>
<label for="ii-no">Notes (optional)</label><input id="ii-no" name="notes" value="${esc(it.notes||"")}">
<div class="row end" style="margin-top:12px">${it.id?(ui.confirm==="ia"+it.id?`<button type="button" class="danger" data-act="invarch" data-id="${it.id}">${it.archived?"Restore":"Archive"}</button>`:`<button type="button" class="ghost" data-act="ask" data-w="ia${it.id}">${it.archived?"Restore":"Archive"}</button>`):""}<span style="flex:1"></span><button type="button" class="ghost" data-act="cancel">Cancel</button><button class="pri">Save item</button></div></form>`}

function invItems(ed){const tags=allTags();let list=I().items.filter(i=>invArch?i.archived:!i.archived).sort((a,b)=>natCmp(a.name,b.name));
  const q=invQ.trim().toLowerCase();if(q)list=list.filter(i=>[i.name,i.brand,i.code,i.unit,...i.tags].join(" ").toLowerCase().includes(q));if(invTag)list=list.filter(i=>i.tags.includes(invTag));
  const info=new Map(list.map(i=>[i.id,stockInfo(i)]));if(invLow)list=list.filter(i=>/bad|warn/.test(lvl(i,info.get(i.id))));
  const low=activeItems().filter(i=>lvl(i,stockInfo(i))==="bad").length;
  let h=`<div class="row" style="margin-bottom:10px"><input id="inv-q" value="${esc(invQ)}" placeholder="Search items" style="flex:1 1 200px;width:auto"><select id="inv-tag" style="width:auto"><option value="">All tags</option>${tags.map(t=>`<option${t===invTag?" selected":""}>${esc(t)}</option>`).join("")}</select><label class="chk"><input type="checkbox" id="inv-low"${invLow?" checked":""}> Low stock only${low?` (${low})`:""}</label><label class="chk"><input type="checkbox" id="inv-arch"${invArch?" checked":""}> Archived</label>${ed?`<button class="pri" data-act="invnew">+ Add item</button>`:""}</div>`;
  if(ui.edit==="ii:new")h+=itemForm({tags:invTag?[invTag]:[]});
  h+=`<div class="legend"><span><i style="background:var(--good)"></i>OK</span><span><i style="background:var(--warn)"></i>within 1 unit of reorder level</span><span><i style="background:var(--bad)"></i>at or below reorder level</span></div>`;
  if(!list.length)return h+`<p class="empty">${I().items.length?"No items match.":"No items yet. Add your lab supplies with a photo, the unit you count in, and when to reorder."}</p>`;
  return h+`<div class="invgrid">`+list.map(it=>{if(ui.edit==="ii:"+it.id)return`<div style="grid-column:1/-1">${itemForm(it)}</div>`;const si=info.get(it.id),lv=lvl(it,si);
    return`<article class="invcard${lv?" lv-"+lv:""}">${phImg(it.photo,"invph")}<div class="ib"><b>${esc(it.name)}</b><div class="small mut">${[it.brand,it.code?"#"+it.code:""].filter(Boolean).map(esc).join(" · ")||"&nbsp;"}</div>
<div class="row" style="margin:8px 0 4px;gap:6px;align-items:baseline"><b style="font-size:26px">${qtxt(si.stock)}</b><span class="small mut">× ${esc(unitOf(it))} on hand</span></div>
<div class="row" style="gap:4px">${lv?`<span class="pill ${lv}">${LV[lv]}</span>`:""}${si.left!=null?`<span class="pill">≈ ${si.left<10?n2(Math.round(si.left*10)/10):Math.round(si.left)} months left</span>`:""}${it.tags.map(t=>`<span class="pill info">${esc(t)}</span>`).join("")}</div>
<div class="small mut" style="margin-top:6px">${it.reorder!==""&&it.reorder!=null?"Reorder at "+n2(it.reorder)+" · ":""}${si.lastCount?"Counted "+esc(fmt(si.lastCount,"short")):"Not counted yet"}${it.supplier&&supById(it.supplier)?" · "+esc(supById(it.supplier).name):""}</div>
${ed?`<div class="row end" style="margin-top:4px"><button class="ghost" data-act="invedit" data-id="${it.id}">Edit</button></div>`:""}</div></article>`}).join("")+`</div>`}

function invCount(ed){const tags=allTags();let list=activeItems();if(invTag)list=list.filter(i=>i.tags.includes(invTag));
  let h=`<p class="mut" style="margin-top:-6px">Count what's on the shelf in each item's unit. Half boxes are fine (2.5). Leave an item blank if you didn't count it. Usage is worked out from the change between counts, minus deliveries.</p>`;
  if(!I().items.length)return h+`<p class="empty">Add items first.</p>`;
  if(ed)h+=`<form class="form" data-form="invcount"><div class="grid3"><div><label for="ct-d">Count date</label><input id="ct-d" name="date" type="date" required value="${iso(today())}"></div>${byInp()}<div><label for="inv-tag">Show</label><select id="inv-tag"><option value="">All items</option>${tags.map(t=>`<option${t===invTag?" selected":""}>${esc(t)}</option>`).join("")}</select></div></div>
<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th></th><th>Item</th><th class="num">Last known</th><th style="width:140px">Count now</th></tr></thead><tbody>${list.map(it=>{const si=stockInfo(it),lv=lvl(it,si);return`<tr><td style="width:56px">${phImg(it.photo,"thumb")}</td><td><b>${esc(it.name)}</b><br><span class="small mut">${esc([it.brand,unitOf(it)].filter(Boolean).join(" · "))}</span></td><td class="num">${qtxt(si.stock)}${lv?` <span class="pill ${lv}">${LV[lv]}</span>`:""}</td><td><input name="c-${it.id}" type="number" step="any" min="0" inputmode="decimal" aria-label="Count for ${esc(it.name)}"></td></tr>`}).join("")}</tbody></table></div>
<div class="row end" style="margin-top:12px"><button class="pri">Save count</button></div></form>`;
  const past=I().counts.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at);
  h+=`<section class="box"><h3>Past counts</h3>${past.length?`<table><tbody>${past.slice(0,40).map(c=>`<tr><td>${esc(fmt(c.date,"short"))}</td><td>${Object.keys(c.q||{}).length} item${Object.keys(c.q||{}).length===1?"":"s"}</td><td>${c.by?`<span class="who" style="${whoCol(c.by)}">${esc(c.by)}</span>`:""}</td><td class="num">${ed?(ui.confirm==="ic"+c.id?`<button class="danger" data-act="invdelcount" data-id="${c.id}">Delete</button>`:`<button class="ghost" data-act="ask" data-w="ic${c.id}">Delete</button>`):""}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">No counts yet.</p>`}</section>`;
  return h}

const ST={draft:["Draft",""],sent:["Sent","info"],received:["Received","good"],cancelled:["Cancelled","bad"]};
function orderForm(o){const sp=I().suppliers;const only=o.supplier&&ui.ioOnly!==false;let list=activeItems();if(only)list=list.filter(i=>i.supplier===o.supplier||(o.lines||{})[i.id]);
  return`<form class="form" data-form="invorder" data-id="${o.id||""}"><div class="grid3"><div><label for="io-sup">Supplier</label><select id="io-sup" name="supplier"><option value="">Choose…</option>${sp.map(s=>`<option value="${s.id}"${s.id===o.supplier?" selected":""}>${esc(s.name)}</option>`).join("")}</select></div>${byInp()}<div><label for="io-n">Note on the order (optional)</label><input id="io-n" name="note" value="${esc(o.note||"")}" placeholder="e.g. Please deliver by Dec 10"></div></div>
${o.supplier?`<label class="chk" style="margin-top:8px"><input type="checkbox" id="io-only"${only?" checked":""}> Only show this supplier's items</label>`:""}
<div class="row" style="margin-top:8px"><button type="button" data-act="invsug">Fill suggested amounts</button><span class="small mut">Suggestions top you up to "keep on hand", or about 3 months of use once you have counts.</span></div>
<div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th></th><th>Item</th><th class="num">On hand</th><th class="num">Suggested</th><th style="width:120px">Order</th></tr></thead><tbody>${list.map(it=>{const si=stockInfo(it),lv=lvl(it,si),sg=sugQty(it,si);const v=(o.lines||{})[it.id];return`<tr><td style="width:56px">${phImg(it.photo,"thumb")}</td><td><b>${esc(it.name)}</b><br><span class="small mut">${esc([it.brand,it.code?"#"+it.code:"",unitOf(it)].filter(Boolean).join(" · "))}</span></td><td class="num">${qtxt(si.stock)}${lv?` <span class="pill ${lv}">${LV[lv]}</span>`:""}</td><td class="num">${sg||""}</td><td><input name="q-${it.id}" type="number" step="any" min="0" value="${v!=null?esc(v):""}" data-sug="${sg}" aria-label="Order amount for ${esc(it.name)}"></td></tr>`}).join("")||`<tr><td colspan="5" class="empty">No items for this supplier yet. Untick "Only show this supplier's items" or set the supplier on your items.</td></tr>`}</tbody></table></div>
<div class="row end" style="margin-top:12px"><button type="button" class="ghost" data-act="cancel">Cancel</button><button class="pri">Save order</button></div></form>`}
function invOrders(ed){let h=`<p class="mut" style="margin-top:-6px">Build an order, then email it to the supplier with the PDF attached and your approvers in CC. Orders stay editable after they're sent. Only what you record as delivered changes your stock and spending.</p>`;
  if(ed)h+=ui.edit==="io:new"?orderForm(ui.ioDraft||{}):`<div class="row"><button class="pri" data-act="invneworder">+ New order</button><span style="flex:1"></span><label class="chk"><input type="checkbox" id="io-open"${invOpenOnly?" checked":""}> Open orders only</label></div>`;
  const list=I().orders.filter(o=>!invOpenOnly||o.status==="draft"||o.status==="sent").sort((a,b)=>b.created-a.created);
  if(!list.length)return h+`<p class="empty" style="margin-top:12px">${I().orders.length?"No open orders.":"No orders yet."}</p>`;
  return h+`<div class="drafts" style="margin-top:12px">`+list.map(o=>{if(ui.edit==="io:"+o.id)return orderForm(ui.ioTemp&&ui.ioTemp.id===o.id?ui.ioTemp:o);const s=supById(o.supplier);const lines=Object.entries(o.lines||{}).filter(([,q])=>+q>0);const [sl,sc]=ST[o.status]||ST.draft;
    return`<article class="draft"><div class="row"><b style="flex:1">Order #${o.no} · ${esc(s?s.name:"No supplier")} <span class="pill ${sc}">${sl}</span></b><span class="small mut">${esc(fmt(iso(new Date(o.created)),"short"))}${o.by?` · <span class="who" style="${whoCol(o.by)};width:28px;height:28px;font-size:11px">${esc(o.by)}</span>`:""}${o.sentAt?" · sent "+esc(fmt(o.sentAt,"short"))+(o.sentBy?" by "+esc(o.sentBy):""):""}</span></div>
<p class="small" style="margin:6px 0">${lines.map(([id,q])=>{const it=itemById(id);return esc((it?it.name:"(removed item)")+" × "+n2(q))}).join(" · ")||'<span class="mut">No items yet</span>'}${o.note?`<br><span class="mut">Note: ${esc(o.note)}</span>`:""}</p>
${ui.edit==="is:"+o.id?`<form class="inl" data-form="invsent" data-id="${o.id}" style="max-width:420px"><input name="by" maxlength="4" required value="${esc(myInit())}" placeholder="Your initials" aria-label="Your initials" style="text-transform:uppercase"><button class="pri">Mark as sent</button><button type="button" class="ghost" data-act="cancel">Cancel</button></form>`:""}
<div class="row" style="margin-top:4px"><button class="pri" data-act="invmail" data-id="${o.id}"${lines.length?"":" disabled"}>Email with PDF</button><button data-act="invpdf" data-id="${o.id}"${lines.length?"":" disabled"}>Download PDF</button><button class="ghost" data-act="invcopy" data-id="${o.id}">Copy email text</button>${ed&&o.status!=="received"&&o.status!=="cancelled"?`<button class="ghost" data-act="invedorder" data-id="${o.id}">Edit</button>${o.status==="draft"?`<button class="ghost" data-act="invsent" data-id="${o.id}">Mark sent</button>`:""}<button class="ghost" data-act="invrecv" data-id="${o.id}">Record delivery</button>${ui.confirm==="ox"+o.id?`<button class="danger" data-act="invcancel" data-id="${o.id}">Cancel order</button>`:`<button class="ghost" data-act="ask" data-w="ox${o.id}">Cancel order</button>`}`:""}${ed&&o.status!=="received"?(ui.confirm==="od"+o.id?`<button class="danger" data-act="invdelorder" data-id="${o.id}">Delete</button>`:`<button class="ghost" data-act="ask" data-w="od${o.id}">Delete</button>`):""}</div></article>`}).join("")+`</div><p class="hint">"Email with PDF" downloads an email file. Open it and it starts a new email in Outlook on your computer with the supplier in To, your approvers in CC and the PDF attached. In Outlook on the web or a phone, use Download PDF and Copy email text instead.</p>`}

function delivForm(d){const sp=I().suppliers;const ord=d.order&&I().orders.find(o=>o.id===d.order);const S=I().settings;let list=activeItems();const L=d.lines||{};
  list.sort((a,b)=>((L[b.id]?1:0)-(L[a.id]?1:0))||((b.supplier===d.supplier?1:0)-(a.supplier===d.supplier?1:0))||natCmp(a.name,b.name));
  const opens=I().orders.filter(o=>o.status==="sent"||o.status==="draft"||o.id===d.order);
  return`<form class="form" data-form="invdeliv" data-id="${d.id||""}"><div class="grid3"><div><label for="dv-d">Date received</label><input id="dv-d" name="date" type="date" required value="${esc(d.date||iso(today()))}"></div><div><label for="dv-s">Supplier</label><select id="dv-s" name="supplier"><option value="">Choose…</option>${sp.map(s=>`<option value="${s.id}"${s.id===d.supplier?" selected":""}>${esc(s.name)}</option>`).join("")}</select></div>${byInp()}</div>
<div class="grid3"><div><label for="dv-o">For order (optional)</label><select id="dv-o" name="order"><option value="">No order</option>${opens.map(o=>`<option value="${o.id}"${o.id===d.order?" selected":""}>#${o.no} · ${esc((supById(o.supplier)||{}).name||"")}</option>`).join("")}</select></div><div><label for="dv-i">Invoice # (optional)</label><input id="dv-i" name="inv" value="${esc(d.inv||"")}"></div><div><label for="dv-n">Note (optional)</label><input id="dv-n" name="note" value="${esc(d.note||"")}"></div></div>
<p class="hint" style="margin:8px 0 0">Enter what actually arrived${ord?" (filled in from the order; change anything that's different)":""}. Unit prices are optional; add them if you want spending by tag.</p>
<div style="overflow-x:auto;margin-top:6px"><table><thead><tr><th></th><th>Item</th><th style="width:110px">Received</th><th style="width:120px">Unit price $</th></tr></thead><tbody>${list.map(it=>{const l=L[it.id]||{};return`<tr><td style="width:56px">${phImg(it.photo,"thumb")}</td><td><b>${esc(it.name)}</b><br><span class="small mut">${esc([it.brand,unitOf(it)].filter(Boolean).join(" · "))}</span></td><td><input name="d-${it.id}" type="number" step="any" min="0" value="${l.q!=null?esc(l.q):""}" data-dv aria-label="Received ${esc(it.name)}"></td><td><input name="p-${it.id}" type="number" step="any" min="0" value="${l.p!=null&&l.p!==""?esc(l.p):""}" data-dv aria-label="Unit price ${esc(it.name)}"></td></tr>`}).join("")}</tbody></table></div>
<div class="grid3" style="margin-top:10px;max-width:760px"><div><label for="dv-sub">Subtotal $</label><input id="dv-sub" name="sub" type="number" step="0.01" min="0" value="${esc(d.sub??"")}" data-dv${d.id?' data-manual="1"':""}></div><div><label for="dv-hst">HST $ <span class="mut" style="font-weight:400">(${n2(S.hst)}%)</span></label><input id="dv-hst" name="hst" type="number" step="0.01" min="0" value="${esc(d.hst??"")}" data-dv${d.id?' data-manual="1"':""}></div><div><label for="dv-sh">Shipping $</label><input id="dv-sh" name="ship" type="number" step="0.01" min="0" value="${esc(d.ship??"")}" data-dv></div></div>
<p style="margin:10px 0 0;font-size:18px"><b>Total: <span id="dv-tot">${money((+d.sub||0)+(+d.hst||0)+(+d.ship||0))}</span></b> <span class="small mut">Type the invoice's subtotal and HST to match it exactly.</span></p>
<div class="row end" style="margin-top:12px"><button type="button" class="ghost" data-act="cancel">Cancel</button><button class="pri">Save delivery</button></div></form>`}
function invDelivs(ed){let h=`<p class="mut" style="margin-top:-6px">Record what arrived and the invoice amounts. This is what updates stock and spending.</p>`;
  if(ed)h+=ui.edit==="id:new"?delivForm(ui.dvDraft||{}):`<button class="pri" data-act="invnewdeliv">+ Record delivery</button>`;
  const list=I().deliveries.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at);
  if(!list.length)return h+`<p class="empty" style="margin-top:12px">No deliveries yet.</p>`;
  return h+`<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Date</th><th>Supplier</th><th>Items</th><th class="num">Total</th><th></th><th></th></tr></thead><tbody>${list.map(d=>ui.edit==="id:"+d.id?`<tr><td colspan="6">${delivForm(ui.dvTemp&&ui.dvTemp.id===d.id?ui.dvTemp:d)}</td></tr>`:`<tr><td style="white-space:nowrap">${esc(fmt(d.date,"short"))}${d.inv?`<br><span class="small mut">Inv ${esc(d.inv)}</span>`:""}</td><td>${esc((supById(d.supplier)||{}).name||"—")}${d.order?`<br><span class="small mut">Order #${esc((I().orders.find(o=>o.id===d.order)||{}).no||"")}</span>`:""}</td><td class="small">${Object.entries(d.lines||{}).filter(([,l])=>+l.q).map(([id,l])=>esc(((itemById(id)||{}).name||"(removed)")+" × "+n2(l.q))).join("<br>")}</td><td class="num"><b>${money(d.total)}</b><br><span class="small mut">HST ${money(d.hst)}</span></td><td>${d.by?`<span class="who" style="${whoCol(d.by)}">${esc(d.by)}</span>`:""}</td><td class="num">${ed?`<button class="ghost" data-act="invedeliv" data-id="${d.id}">Edit</button>${ui.confirm==="dd"+d.id?`<button class="danger" data-act="invdeldeliv" data-id="${d.id}">Delete</button>`:`<button class="ghost" data-act="ask" data-w="dd${d.id}">Delete</button>`}`:""}</td></tr>`).join("")}</tbody></table></div>`}

function invYears(){const s=new Set([today().getFullYear()]);I().deliveries.forEach(d=>s.add(+d.date.slice(0,4)));I().counts.forEach(c=>s.add(+c.date.slice(0,4)));return[...s].sort((a,b)=>b-a)}
function spendQ(y,tag){const Q=[0,1,2,3].map(()=>({sub:0,hst:0,ship:0,total:0,tag:0}));I().deliveries.forEach(d=>{if(+d.date.slice(0,4)!==y)return;const q=Q[qOf(d.date)];q.sub+=+d.sub||0;q.hst+=+d.hst||0;q.ship+=+d.ship||0;q.total+=+d.total||0;
  if(tag)Object.entries(d.lines||{}).forEach(([id,l])=>{const it=itemById(id);if(it&&it.tags.includes(tag)&&l.p!==""&&l.p!=null)q.tag+=(+l.q||0)*(+l.p||0)})});return Q}
function usageQ(y,tag){return I().items.filter(i=>!tag||i.tags.includes(tag)).map(it=>{const si=stockInfo(it);const Q=[0,0,0,0];si.iv.forEach(x=>{if(+x.to.slice(0,4)===y)Q[qOf(x.to)]+=x.used});return{it,si,Q,tot:Q.reduce((a,b)=>a+b,0)}}).filter(r=>r.tot>0||!r.it.archived).sort((a,b)=>b.tot-a.tot||natCmp(a.it.name,b.it.name))}
function invHistory(y){const H=[];I().counts.forEach(c=>{if(+c.date.slice(0,4)===y)H.push({date:c.date,at:c.at,kind:"Count",what:Object.keys(c.q||{}).length+" item"+(Object.keys(c.q||{}).length===1?"":"s")+" counted",by:c.by})});
  I().deliveries.forEach(d=>{if(+d.date.slice(0,4)===y)H.push({date:d.date,at:d.at,kind:"Delivery",what:((supById(d.supplier)||{}).name||"No supplier")+" · "+Object.values(d.lines||{}).filter(l=>+l.q).length+" items · "+money(d.total),by:d.by})});
  I().orders.forEach(o=>{const dc=iso(new Date(o.created));if(+dc.slice(0,4)===y)H.push({date:dc,at:o.created,kind:"Order created",what:"#"+o.no+" · "+((supById(o.supplier)||{}).name||""),by:o.by});if(o.sentAt&&+o.sentAt.slice(0,4)===y)H.push({date:o.sentAt,at:o.sentStamp||0,kind:"Order sent",what:"#"+o.no+" · "+((supById(o.supplier)||{}).name||""),by:o.sentBy})});
  return H.sort((a,b)=>b.date.localeCompare(a.date)||(b.at||0)-(a.at||0))}
function invReports(){const ys=invYears();if(!rpYear||!ys.includes(rpYear))rpYear=ys[0];const tags=allTags();if(rpTag&&!tags.includes(rpTag))rpTag="";

<div class="stats"><div class="stat info"><b>${money(T.total)}</b><span>spent in ${rpYear}, with HST and shipping</span></div><div class="stat"><b>${money(T.sub)}</b><span>before tax</span></div>${rpTag?`<div class="stat violet"><b>${money(T.tag)}</b><span>on items tagged ${esc(rpTag)} (from unit prices, before tax)</span></div>`:""}</div>
<h3 style="margin-top:18px">Spending by quarter</h3><div style="overflow-x:auto"><table><thead><tr><th>Quarter</th><th class="num">Subtotal</th><th class="num">HST</th><th class="num">Shipping</th><th class="num">Total</th>${rpTag?`<th class="num">Tagged ${esc(rpTag)}</th>`:""}</tr></thead><tbody>${Q.map((q,k)=>`<tr><td>Q${k+1} <span class="small mut">${["Jan–Mar","Apr–Jun","Jul–Sep","Oct–Dec"][k]}</span></td><td class="num">${money(q.sub)}</td><td class="num">${money(q.hst)}</td><td class="num">${money(q.ship)}</td><td class="num"><b>${money(q.total)}</b></td>${rpTag?`<td class="num">${money(q.tag)}</td>`:""}</tr>`).join("")}</tbody><tfoot><tr><td><b>${rpYear}</b></td><td class="num"><b>${money(T.sub)}</b></td><td class="num"><b>${money(T.hst)}</b></td><td class="num"><b>${money(T.ship)}</b></td><td class="num"><b>${money(T.total)}</b></td>${rpTag?`<td class="num"><b>${money(T.tag)}</b></td>`:""}</tr></tfoot></table></div>
${rpTag?`<p class="hint">The tagged column only includes deliveries where you entered unit prices. Shared items (like bandaids tagged Phlebotomy and IM) appear under each tag but are counted once in the totals.</p>`:""}

function invOverview(){const S=I().settings;const items=activeItems();if(!S.remind||!items.length)return"";const low=items.filter(i=>/bad|warn/.test(lvl(i,stockInfo(i))));
  const last=I().counts.map(c=>c.date).sort().pop();const ago=last?-days(last):null;const due=!last||ago>=+S.countEvery;const sent=I().orders.filter(o=>o.status==="sent").length;
  if(!low.length&&!due&&!sent)return"";
  return`<a href="#inventory" class="banner" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;text-decoration:none;color:var(--ink);margin:12px 0 0"><b>Inventory</b>${low.length?`<span class="pill ${low.some(i=>lvl(i,stockInfo(i))==="bad")?"bad":"warn"}">${low.length} item${low.length>1?"s":""} low</span>`:""}${due?`<span class="pill warn">Count due${last?" · last "+esc(fmt(last,"short")):""}</span>`:""}${sent?`<span class="pill info">${sent} order${sent>1?"s":""} waiting for delivery</span>`:""}</a>`}

/* ---------- order PDF and email ---------- */
const fillOrder=(t,o)=>{const s=supById(o.supplier)||{};const lines=Object.entries(o.lines||{}).filter(([,q])=>+q>0).map(([id,q])=>{const it=itemById(id)||{name:"(removed item)"};return"• "+it.name+([it.brand,it.code?"#"+it.code:""].filter(Boolean).length?" ("+[it.brand,it.code?"#"+it.code:""].filter(Boolean).join(", ")+")":"")+" — "+n2(q)+" × "+unitOf(it)});
  return String(t||"").replace(/\[supplier\]/gi,s.contact||s.name||"").replace(/\[date\]/gi,fmt(iso(today()),"nodow")).replace(/\[order number\]/gi,String(o.no)).replace(/\[items\]/gi,lines.join("\n")).replace(/\[note\]/gi,o.note||"")};
async function orderPDF(o){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js").catch(()=>{});if(!window.jspdf)throw new Error("pdf");
  const {jsPDF}=window.jspdf;const p=new jsPDF({unit:"mm",format:"a4"});const S=I().settings;const s=supById(o.supplier)||{};const W=210,M=15;
  const lines=Object.entries(o.lines||{}).filter(([,q])=>+q>0).map(([id,q])=>({it:itemById(id)||{name:"(removed item)"},q}));
  for(const l of lines)l.ph=await ensurePhoto(l.it.photo);
  let y=18;p.setFont("helvetica","bold");p.setFontSize(16);p.text(S.org||data.settings.name||"Program Hub",M,y);p.setFontSize(12);p.setFont("helvetica","normal");p.text("Lab supply order",M,y+7);
  p.setFontSize(11);p.setFont("helvetica","bold");p.text("Order #"+o.no,W-M,y,{align:"right"});p.setFont("helvetica","normal");p.text(fmt(iso(today()),"nodow"),W-M,y+6,{align:"right"});
  y+=16;p.setDrawColor(200);p.line(M,y,W-M,y);y+=7;p.setFontSize(10);p.setTextColor(110);p.text("SUPPLIER",M,y);p.setTextColor(20);p.setFontSize(11);p.text([s.name||"",s.email||""].filter(Boolean),M,y+5);
  if(o.note){p.setFontSize(10);p.setTextColor(110);p.text("NOTE",W/2,y);p.setTextColor(20);p.setFontSize(11);p.text(p.splitTextToSize(o.note,W/2-M),W/2,y+5)}
  y+=18;const head=()=>{p.setFillColor(238,240,245);p.rect(M,y-5,W-2*M,8,"F");p.setFontSize(9);p.setTextColor(80);p.setFont("helvetica","bold");p.text("PHOTO",M+2,y);p.text("ITEM",M+34,y);p.text("UNIT",M+122,y);p.text("QTY",W-M-2,y,{align:"right"});p.setFont("helvetica","normal");p.setTextColor(20);y+=7};head();
  lines.forEach((l,k)=>{const it=l.it;const nameL=p.splitTextToSize(it.name,84),sub=[it.brand,it.code?"Item # "+it.code:""].filter(Boolean),unitL=p.splitTextToSize(unitOf(it),36);
    const th=nameL.length*5+sub.length*4.5+2,ph=l.ph?28:0,rh=Math.max(ph,th,unitL.length*5)+4;if(y+rh>282){p.addPage();y=18;head()}
    if(l.ph){const r=Math.min(28/l.ph.w,28/l.ph.h);const w=l.ph.w*r,h=l.ph.h*r;try{p.addImage(l.ph.d,"JPEG",M+2+(28-w)/2,y+(28-h)/2,w,h)}catch(e){}}else{p.setFontSize(8);p.setTextColor(150);p.text("no photo",M+6,y+6);p.setTextColor(20)}
    p.setFontSize(11);p.setFont("helvetica","bold");p.text(nameL,M+34,y+4);p.setFont("helvetica","normal");p.setFontSize(9);p.setTextColor(90);sub.forEach((t,j)=>p.text(t,M+34,y+4+nameL.length*5+j*4.5));p.setTextColor(20);
    p.setFontSize(10);p.text(unitL,M+122,y+4);p.setFontSize(13);p.setFont("helvetica","bold");p.text(String(n2(l.q)),W-M-2,y+5,{align:"right"});p.setFont("helvetica","normal");
    y+=rh;p.setDrawColor(225);p.line(M,y-2,W-M,y-2)});
  y+=4;if(y>280){p.addPage();y=20}p.setFontSize(10);p.setTextColor(90);p.text(lines.length+" item"+(lines.length===1?"":"s"),M,y);
  const n=p.getNumberOfPages();for(let i=1;i<=n;i++){p.setPage(i);p.setFontSize(8);p.setTextColor(140);p.text("Order #"+o.no+" · page "+i+" of "+n,W-M,292,{align:"right"})}
  return p}
const pdfName=o=>("Order-"+o.no+"-"+((supById(o.supplier)||{}).name||"supplier")).replace(/[^\w\-]+/g,"_")+".pdf";
function dlBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
const b64u=s=>btoa(unescape(encodeURIComponent(s)));const hdr=s=>/^[\x20-\x7e]*$/.test(s)?s:"=?UTF-8?B?"+b64u(s)+"?=";
function abToB64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
const wrap76=s=>s.replace(/(.{76})/g,"$1\r\n");
async function orderEml(o){const S=I().settings;const s=supById(o.supplier)||{};const pdf=await orderPDF(o);const att=abToB64(pdf.output("arraybuffer"));
  const html='<div style="font-family:Calibri,Arial,sans-serif;font-size:11pt">'+textToHtml(fillOrder(S.body,o))+"</div>";const B="=_ph_"+uid();
  const cc=String(S.cc||"").split(/[;,]\s*/).filter(Boolean).join(", ");
  const eml=["To: "+(s.email||""),cc?"Cc: "+cc:"","Subject: "+hdr(fillOrder(S.subject,o)),"X-Unsent: 1","MIME-Version: 1.0",`Content-Type: multipart/mixed; boundary="${B}"`,"","--"+B,'Content-Type: text/html; charset="utf-8"',"Content-Transfer-Encoding: base64","",wrap76(b64u(html)),"--"+B,`Content-Type: application/pdf; name="${pdfName(o)}"`,`Content-Disposition: attachment; filename="${pdfName(o)}"`,"Content-Transfer-Encoding: base64","",wrap76(att),"--"+B+"--",""].filter((l,i)=>l!==""||i>4).join("\r\n");
  dlBlob(new Blob([eml],{type:"message/rfc822"}),pdfName(o).replace(/\.pdf$/,".eml"))}

async function invXL(){try{await loadXL()}catch(e){toast("Couldn't load the Excel maker. Check your connection.");return}const wb=new ExcelJS.Workbook();const y=rpYear;const bold={bold:true};
  const ws1=wb.addWorksheet("Stock");ws1.addRow(["Item","Brand","Item #","Unit","Tags","Supplier","On hand","Reorder at","Status","Months left","Last count"]).font=bold;
  activeItems().forEach(it=>{const si=stockInfo(it),lv=lvl(it,si);ws1.addRow([it.name,it.brand||"",it.code||"",unitOf(it),it.tags.join(", "),(supById(it.supplier)||{}).name||"",si.stock,it.reorder===""||it.reorder==null?null:+it.reorder,LV[lv]||"",si.left!=null?n2(si.left):null,si.lastCount||""])});
  const ws2=wb.addWorksheet("Spending "+y);ws2.addRow(["Quarter","Subtotal","HST","Shipping","Total"]).font=bold;spendQ(y,"").forEach((q,k)=>ws2.addRow(["Q"+(k+1),n2(q.sub),n2(q.hst),n2(q.ship),n2(q.total)]));ws2.addRow(["Total",{formula:"SUM(B2:B5)"},{formula:"SUM(C2:C5)"},{formula:"SUM(D2:D5)"},{formula:"SUM(E2:E5)"}]).font=bold;
  ws2.addRow([]);ws2.addRow(["Date","Supplier","Invoice #","Subtotal","HST","Shipping","Total","By"]).font=bold;I().deliveries.filter(d=>+d.date.slice(0,4)===y).sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>ws2.addRow([d.date,(supById(d.supplier)||{}).name||"",d.inv||"",n2(d.sub),n2(d.hst),n2(d.ship),n2(d.total),d.by||""]));
  const ws3=wb.addWorksheet("Usage "+y);ws3.addRow(["Item","Unit","Q1","Q2","Q3","Q4","Year","Per month now"]).font=bold;usageQ(y,"").forEach(r=>ws3.addRow([r.it.name,unitOf(r.it),...r.Q.map(n2),n2(r.tot),r.si.rate?n2(r.si.rate):null]));
  const ws4=wb.addWorksheet("History "+y);ws4.addRow(["Date","What","Details","By"]).font=bold;invHistory(y).forEach(x=>ws4.addRow([x.date,x.kind,x.what,x.by||""]));
  [ws1,ws2,ws3,ws4].forEach(w=>w.columns.forEach((c,i)=>c.width=i===0?34:16));
  const buf=await wb.xlsx.writeBuffer();dlBlob(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"Inventory_"+y+"_"+iso(today())+".xlsx");toast("Excel downloaded")}

/* ---------- inventory events ---------- */
function invChange(t){
  if(t.id==="inv-tag"){invTag=t.value;render();return true}if(t.id==="inv-low"){invLow=t.checked;render();return true}if(t.id==="inv-arch"){invArch=t.checked;render();return true}
  if(t.id==="io-open"){invOpenOnly=t.checked;render();return true}if(t.id==="rp-year"){rpYear=+t.value;render();return true}if(t.id==="rp-tag"){rpTag=t.value;render();return true}
  if(t.id==="io-sup"||t.id==="io-only"){const f=t.form;const o=readOrderForm(f);if(t.id==="io-only")ui.ioOnly=t.checked;else ui.ioOnly=true;const id=f.dataset.id;if(id){const real=I().orders.find(x=>x.id===id);ui.ioTemp=Object.assign({},real,o);}else ui.ioDraft=o;rerenderOrder(id);return true}
  if(t.id==="dv-o"){const f=t.form;const o=I().orders.find(x=>x.id===t.value);if(!o)return false;const d=readDelivForm(f);d.order=o.id;d.supplier=o.supplier;d.lines={};Object.entries(o.lines||{}).forEach(([id,q])=>{if(+q>0)d.lines[id]={q:+q,p:""}});if(f.dataset.id)ui.dvTemp=Object.assign({id:f.dataset.id},d);else ui.dvDraft=d;rerenderDeliv(f.dataset.id);return true}
  if(t.id==="ii-photo"&&t.files[0]){const fr=new FileReader();fr.onload=()=>shrink(fr.result,560,.72).then(p=>{pendPhoto=p;const pv=$("ii-prev");if(pv)pv.innerHTML=`<img class="thumb" src="${p.d}" alt="">`}).catch(()=>toast("Couldn't read that photo."));fr.readAsDataURL(t.files[0]);return true}
  return false}
function readOrderForm(f){const o={supplier:f.elements.supplier.value,note:f.elements.note.value.trim(),lines:{}};[...f.querySelectorAll("input[name^='q-']")].forEach(x=>{if(x.value!=="")o.lines[x.name.slice(2)]=+x.value});return o}
function readDelivForm(f){const v=n=>(f.elements[n]&&f.elements[n].value||"").trim();const d={date:v("date"),supplier:v("supplier"),order:v("order"),inv:v("inv"),note:v("note"),sub:v("sub"),hst:v("hst"),ship:v("ship"),lines:{}};
  [...f.querySelectorAll("input[name^='d-']")].forEach(x=>{const id=x.name.slice(2);const p=f.elements["p-"+id].value;if(x.value!==""&&+x.value>0)d.lines[id]={q:+x.value,p:p===""?"":+p}});return d}
function rerenderOrder(id){const keep=readOrderKeep();render();restoreKeep(keep)}
function rerenderDeliv(){render()}
const readOrderKeep=()=>{const b=$("by-in");return b?b.value:""};const restoreKeep=v=>{const b=$("by-in");if(b&&v)b.value=v};
function dvRecalc(f){const S=I().settings;let sum=0,any=false;[...f.querySelectorAll("input[name^='d-']")].forEach(x=>{const p=f.elements["p-"+x.name.slice(2)].value;if(x.value!==""&&p!==""){sum+=(+x.value)*(+p);any=true}});
  const sub=f.elements.sub,hst=f.elements.hst;if(any&&!sub.dataset.manual)sub.value=n2(sum).toFixed(2);if(sub.value!==""&&!hst.dataset.manual)hst.value=n2((+sub.value)*(+S.hst)/100).toFixed(2);
  const tot=(+sub.value||0)+(+hst.value||0)+(+f.elements.ship.value||0);const el=$("dv-tot");if(el)el.textContent=money(tot)}
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="inv-q"){invQ=t.value;const pos=t.selectionStart;render();const x=$("inv-q");if(x){x.focus();x.setSelectionRange(pos,pos)}return}
  if(t.dataset&&t.dataset.dv!=null){const f=t.form;if(t.id==="dv-sub"||t.id==="dv-hst")t.dataset.manual=t.value===""?"":"1";if(t.id==="dv-sub"&&t.value===""){}dvRecalc(f)}});
function invAct(a,b){
  if(a==="invtab"){invTab=b.dataset.v;reset();render();return true}
  if(a==="invpdf"||a==="invmail"){const o=I().orders.find(x=>x.id===b.dataset.id);if(!o)return true;toast(a==="invpdf"?"Making the PDF…":"Making the email…");
    (a==="invpdf"?orderPDF(o).then(p=>{dlBlob(p.output("blob"),pdfName(o));toast("PDF downloaded")}):orderEml(o).then(()=>toast("Email file downloaded. Open it to start the email in Outlook."))).catch(()=>toast("Couldn't make the file. Check your connection and try again."));return true}
  if(a==="invcopy"){const o=I().orders.find(x=>x.id===b.dataset.id);if(!o)return true;const S=I().settings;const s=supById(o.supplier)||{};copyText("To: "+(s.email||"")+"\nCc: "+(S.cc||"")+"\nSubject: "+fillOrder(S.subject,o)+"\n\n"+fillOrder(S.body,o),"Email text");return true}
  if(a==="invxl"){invXL();return true}
  if(readOnly)return false;
  if(a==="invnew"){reset();pendPhoto=null;ui.edit="ii:new";render();$("ii-n")?.focus();return true}
  if(a==="invedit"){reset();pendPhoto=null;ui.edit="ii:"+b.dataset.id;render();return true}
  if(a==="invarch"){const it=itemById(b.dataset.id);if(it){it.archived=!it.archived;reset();save(true);render();toast(it.archived?"Archived. Find it under Archived.":"Restored")}return true}
  if(a==="invdelcount"){I().counts=I().counts.filter(c=>c.id!==b.dataset.id);reset();save(true);render();toast("Count deleted");return true}
  if(a==="invneworder"){reset();ui.ioDraft={};ui.edit="io:new";render();return true}
  if(a==="invedorder"){reset();ui.edit="io:"+b.dataset.id;render();return true}
  if(a==="invsug"){const f=b.closest("form");f.querySelectorAll("input[data-sug]").forEach(x=>{if(x.value===""&&+x.dataset.sug>0)x.value=x.dataset.sug});toast("Suggested amounts filled in. Change any you like.");return true}
  if(a==="invsent"){reset();ui.edit="is:"+b.dataset.id;render();return true}
  if(a==="invcancel"){const o=I().orders.find(x=>x.id===b.dataset.id);if(o)o.status="cancelled";reset();save(true);render();return true}
  if(a==="invdelorder"){I().orders=I().orders.filter(x=>x.id!==b.dataset.id);reset();save(true);render();toast("Order deleted");return true}
  if(a==="invrecv"){const o=I().orders.find(x=>x.id===b.dataset.id);if(!o)return true;const d={order:o.id,supplier:o.supplier,lines:{}};Object.entries(o.lines||{}).forEach(([id,q])=>{if(+q>0)d.lines[id]={q:+q,p:""}});reset();ui.dvDraft=d;ui.edit="id:new";invTab="deliv";render();return true}
  if(a==="invnewdeliv"){reset();ui.dvDraft={};ui.edit="id:new";render();return true}
  if(a==="invedeliv"){reset();ui.edit="id:"+b.dataset.id;render();return true}
  if(a==="invdeldeliv"){const d=I().deliveries.find(x=>x.id===b.dataset.id);I().deliveries=I().deliveries.filter(x=>x.id!==b.dataset.id);if(d&&d.order){const o=I().orders.find(x=>x.id===d.order);if(o&&o.status==="received")o.status="sent"}reset();save(true);render();toast("Delivery deleted");return true}
  if(a==="invnewsup"){reset();ui.edit="sp:new";render();return true}if(a==="invedsup"){reset();ui.edit="sp:"+b.dataset.id;render();return true}
  if(a==="invdelsup"){I().suppliers=I().suppliers.filter(s=>s.id!==b.dataset.id);reset();save(true);render();return true}
  return false}
function invForm(f){const k=f.dataset.form;if(!/^inv/.test(k))return false;if(readOnly)return true;const v=n=>(f.elements[n]&&f.elements[n].value||"").trim();const num_=n=>v(n)===""?"":+v(n);
  if(k==="invitem"){(async()=>{const id=f.dataset.id;const tags=[...new Set([...f.querySelectorAll("input[name=tag]:checked")].map(x=>x.value).concat(v("newtags").split(",").map(s=>s.trim()).filter(Boolean)))];
    const body={name:v("name"),brand:v("brand"),code:v("code"),unit:v("unit"),supplier:v("supplier"),tags,reorder:num_("reorder"),keep:num_("keep"),notes:v("notes")};
    let it=id?itemById(id):null;if(!it){it=Object.assign({id:uid(),photo:"",archived:false},body);I().items.push(it)}else Object.assign(it,body);
    if(f.elements.nophoto&&f.elements.nophoto.checked){dropPhoto(it.photo);it.photo=""}
    if(pendPhoto){const old=it.photo;it.photo=await putPhoto(pendPhoto);if(old)dropPhoto(old);pendPhoto=null}
    if(!id&&v("start")!==""){const by=takeBy(f);I().counts.push({id:uid(),date:iso(today()),at:nowAt(),by,q:{[it.id]:+v("start")}})}
    reset();save(true);render();toast(id?"Item saved":"Item added")})();return true}
  if(k==="invcount"){const q={};[...f.querySelectorAll("input[name^='c-']")].forEach(x=>{if(x.value!=="")q[x.name.slice(2)]=+x.value});if(!Object.keys(q).length){toast("Enter at least one count.");return true}
    I().counts.push({id:uid(),date:v("date")||iso(today()),at:nowAt(),by:takeBy(f),q});reset();save(true);render();toast("Count saved for "+Object.keys(q).length+" item"+(Object.keys(q).length===1?"":"s"));return true}
  if(k==="invorder"){const o=readOrderForm(f);const by=takeBy(f);if(!Object.values(o.lines).some(q=>+q>0)){toast("Enter an amount for at least one item.");return true}
    Object.keys(o.lines).forEach(id=>{if(!(+o.lines[id]>0))delete o.lines[id]});
    if(f.dataset.id){Object.assign(I().orders.find(x=>x.id===f.dataset.id)||{},o)}else{const S=I().settings;I().orders.push(Object.assign({id:uid(),no:S.nextNo,created:Date.now(),by,status:"draft"},o));S.nextNo=(+S.nextNo||1)+1}
    ui.ioDraft=null;ui.ioTemp=null;reset();save(true);render();toast("Order saved");return true}
  if(k==="invsent"){const o=I().orders.find(x=>x.id===f.dataset.id);if(o){o.status="sent";o.sentAt=iso(today());o.sentStamp=Date.now();o.sentBy=takeBy(f)}reset();save(true);render();toast("Marked as sent");return true}
  if(k==="invdeliv"){const d=readDelivForm(f);if(!Object.keys(d.lines).length){toast("Enter what arrived for at least one item.");return true}
    d.sub=d.sub===""?0:+d.sub;d.hst=d.hst===""?0:+d.hst;d.ship=d.ship===""?0:+d.ship;d.total=n2(d.sub+d.hst+d.ship);const by=takeBy(f);
    let rec;if(f.dataset.id){rec=I().deliveries.find(x=>x.id===f.dataset.id);const oldOrder=rec.order;Object.assign(rec,d,{by:by||rec.by});if(oldOrder&&oldOrder!==d.order){const oo=I().orders.find(x=>x.id===oldOrder);if(oo&&oo.status==="received")oo.status="sent"}}
    else{rec=Object.assign({id:uid(),at:nowAt(),by},d);I().deliveries.push(rec)}
    if(d.order){const o=I().orders.find(x=>x.id===d.order);if(o){o.status="received";o.delivery=rec.id}}
    ui.dvDraft=null;reset();save(true);render();toast("Delivery saved. Stock updated.");return true}
  if(k==="invsup"){const body={name:v("name"),email:v("email"),contact:v("contact")};if(f.dataset.id)Object.assign(supById(f.dataset.id)||{},body);else I().suppliers.push(Object.assign({id:uid()},body));reset();save(true);render();toast("Supplier saved");return true}
  if(k==="invset"){Object.assign(I().settings,{cc:v("cc"),subject:v("subject")||"Lab supply order #[Order number] – [Date]",body:f.elements.body.value||INV_BODY,org:v("org"),hst:v("hst")===""?13:+v("hst"),countEvery:+v("countEvery")||30,remind:f.elements.remind.checked});save(true);render();toast("Saved");return true}
  return true}

document.addEventListener("dragover",e=>{if(e.target.closest&&e.target.closest(".drop"))e.preventDefault()});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest(".drop");if(!z)return;e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;const inp=z.querySelector("input[type=file]");try{const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;inp.dispatchEvent(new Event("change",{bubbles:true}))}catch(x){}});
if(window.claude&&typeof window.claude.use==="function"){window.claude.use("db").then(db=>db?startDb(db):startLocal()).catch(startLocal)}
else if(FB_ON)startFirebase();else startLocal();
}
